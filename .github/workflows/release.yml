# Builds a signed release AAB. Does not upload to Google Play.
#
# google-services.json is not in git. This workflow writes it to
# app/google-services.json from the GOOGLE_SERVICES_JSON secret.
# The upload keystore is decoded to $RUNNER_TEMP and is not committed.
# The keystore alias must be "upload".
name: Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: versionName stored in the AAB
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "Missing secret GOOGLE_SERVICES_JSON" >&2
            exit 1
          fi
          umask 077
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\n\r' | base64 -d > "${RUNNER_TEMP}/upload.jks"
          if [ ! -s "${RUNNER_TEMP}/upload.jks" ]; then
            echo "Decoded keystore is empty" >&2
            exit 1
          fi
          printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          if [ -n "${GEMINI_API_KEY}" ]; then
            printf 'GEMINI_API_KEY=%s\n' "${GEMINI_API_KEY}" > .env
          else
            echo "GEMINI_API_KEY is not set; the release AAB will use the placeholder from .env.example."
          fi

      - name: Bundle signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "Missing STORE_PASSWORD or KEY_PASSWORD" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME}"
          fi
          VERSION_NAME="${VERSION_NAME#v}"
          if [ -z "${VERSION_NAME}" ]; then
            VERSION_NAME="1.0.0"
          fi
          export VERSION_NAME
          echo "versionName=${VERSION_NAME} versionCode=${GITHUB_RUN_NUMBER}"
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sbtech-investor-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
